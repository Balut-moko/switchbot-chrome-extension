<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle with SwitchBot brand red -->
  <circle cx="64" cy="64" r="60" fill="#E8381E"/>
  <!-- Bot body: rounded white shape -->
  <rect x="32" y="44" width="64" height="48" rx="14" fill="white"/>
  <!-- Bot eyes -->
  <circle cx="48" cy="64" r="7" fill="#E8381E"/>
  <circle cx="80" cy="64" r="7" fill="#E8381E"/>
  <!-- Bot antenna -->
  <line x1="64" y1="44" x2="64" y2="28" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <circle cx="64" cy="24" r="6" fill="white"/>
  <!-- Power indicator on antenna -->
  <circle cx="64" cy="24" r="3" fill="#E8381E"/>
</svg>
